<!-- THiS CRM v0.17.70 — replace the existing seminar iframe block with this complete snippet. Deploy v0.17.70 first. -->
<div class="this-seminar-embed" style="width:100%;max-width:100%;margin:0;">
  <iframe title="Turner Hopkins seminar registration" src="https://thisvisacrm.netlify.app/seminar?embed=1"
    style="display:block;width:100%;height:1100px;min-height:0;border:0;background:transparent;" scrolling="no" loading="eager"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<script>
(function () {
  var script = document.currentScript;
  var wrap = script && script.previousElementSibling;
  if (!wrap || !wrap.classList.contains('this-seminar-embed')) return;
  var frame = wrap.querySelector('iframe');
  var origin = new URL(frame.src).origin;
  var lastHeight = 0;
  function requestHeight() {
    frame.contentWindow && frame.contentWindow.postMessage({type:'THIS_SEMINAR_REQUEST_HEIGHT'}, origin);
  }
  function receive(event) {
    if (event.origin !== origin || event.source !== frame.contentWindow) return;
    var data = event.data || {};
    if (data.type !== 'THIS_SEMINAR_EMBED_HEIGHT' || data.source !== 'this-crm-seminar') return;
    if (typeof data.height !== 'number' || !Number.isFinite(data.height) || data.height < 80 || data.height > 100000) return;
    var height = Math.ceil(data.height);
    if (Math.abs(height-lastHeight)<2) return;
    lastHeight=height;
    frame.style.height=height+'px';
  }
  window.addEventListener('message',receive);
  frame.addEventListener('load',requestHeight);
  requestHeight();
})();
</script>
