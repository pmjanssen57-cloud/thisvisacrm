<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#003736" />
    <title>THiS CRM — Offline</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; background: #f4fbf8; color: #003736; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); background: radial-gradient(circle at top right, rgba(85,217,160,.2), transparent 36%), #f4fbf8; }
      main { width: min(440px, 100%); background: #fff; border: 1px solid #cfe2db; border-radius: 24px; padding: 34px; text-align: center; box-shadow: 0 22px 70px rgba(0,55,54,.12); }
      img { width: min(260px, 78%); height: auto; }
      h1 { margin: 26px 0 10px; font-size: clamp(1.55rem, 5vw, 2rem); }
      p { margin: 0 0 24px; color: #486864; line-height: 1.6; }
      a { display: inline-block; border-radius: 12px; padding: 13px 18px; background: #003736; color: #fff; font: inherit; font-weight: 700; text-decoration: none; }
      small { display: block; margin-top: 18px; color: #6f8884; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main>
      <img src="/turner-hopkins-logo.png" alt="Turner Hopkins Immigration Specialists" />
      <h1>THiS CRM is offline</h1>
      <p>Reconnect to the internet to securely access client records, tasks, documents and portal information.</p>
      <a href="/">Try again</a>
      <small>For security, confidential CRM information is not stored for offline access.</small>
    </main>
  </body>
</html>
