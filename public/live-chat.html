<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Turner Hopkins Live Chat</title>
  <link rel="stylesheet" href="/live-chat.css?v=0.15.3" />
</head>
<body>
  <div id="chat-app" class="chat-app">
    <header class="chat-header">
      <div class="chat-brand">
        <div id="chat-brand-avatar" class="chat-brand-avatar company-avatar"><img id="chat-brand-image" src="/turner-hopkins-logo.png" alt="" /><span id="chat-brand-initials" aria-hidden="true">TH</span></div>
        <div><strong id="chat-brand-name">Turner Hopkins</strong><span id="chat-status-label">Checking availability…</span></div>
      </div>
      <button id="chat-close" class="icon-button" type="button" aria-label="Close live chat">×</button>
    </header>
    <main id="chat-main" class="chat-main" aria-live="polite">
      <section class="chat-loading"><span class="spinner"></span><p>Loading live chat…</p></section>
    </main>
  </div>
  <script src="/live-chat.js?v=0.15.3" defer></script>
</body>
</html>
