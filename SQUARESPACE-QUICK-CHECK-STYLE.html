<!-- Add after the existing Visa Quick Check code, or in that page's Header Code Injection. Keep the original form and script. -->
<style id="this-quick-check-site-refresh">

#this-smc-quick-check{--ink:#042d2d;--mint:#dff6ed;--pale:#f3faf6;--line:#d3e1da;--muted:#526c64;--text:#163d36;--shadow:none;font-family:Montserrat,Arial,sans-serif!important;color:var(--text);line-height:1.6}

#this-smc-quick-check .sr-card:before{display:none!important}

#this-smc-quick-check :is(.vp-route-card,.sr-choice,.sr-category-card,.sr-occupation-option,.vp-choice){border:1px solid #c5d8cb!important;background:#fff!important;border-radius:9px!important;box-shadow:none!important;color:#163f31!important}
